<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Rocket League Online</title>
    <link rel="stylesheet" href="style.css">
    <!-- ZMIANA DLA CBA.PL: Ładujemy socket.io z internetu (CDN) -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
</head>
<body>
    <div id="start-screen">
        <h1>ROCKET LEAGUE 3D</h1>
        <button id="start-btn">GRAJ</button>
        <p style="margin-top: 20px; font-size: 18px; color: #ccc;">Sterowanie: WASD + Spacja (Skok) + Shift (Boost)</p>
    </div>
    <div id="ui">
        <div id="score">0 - 0</div>
        <div id="controls">
            <p id="role-display">Łączenie...</p>
            <p>WASD: Jazda/Lot | Spacja: Skok | Shift: Boost | R: Reset</p>
        </div>
        <div id="boost-container" style="position: absolute; bottom: 20px; right: 20px; width: 200px; height: 30px; background: rgba(0,0,0,0.5); border: 2px solid white; border-radius: 15px; overflow: hidden;">
            <div id="boost-bar" style="width: 100%; height: 100%; background: #ffaa00; transition: width 0.1s;"></div>
            <div id="boost-text" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-family: sans-serif; font-weight: bold; font-size: 14px;">100</div>
        </div>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
